name: Sync IP practice skills back

on:
  push:
    branches: [main]
    paths:
      - "skills/cn-patent-fast-track-screener/**"
      - "skills/cn-office-action-prior-art-collector/**"
      - "skills/cn-trademark-goods-services-recommender/**"
  workflow_dispatch:
    inputs:
      skills:
        description: Comma-separated skill names; leave blank to sync all three skills
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-ip-practice-skills-back
  cancel-in-progress: false

jobs:
  open-upstream-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub CLI Git credentials
        env:
          GH_TOKEN: ${{ secrets.IP_PRACTICE }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing repository secret IP_PRACTICE" >&2
            exit 1
          fi
          gh auth setup-git

      - name: Verify token can push to source repository
        env:
          GH_TOKEN: ${{ secrets.IP_PRACTICE }}
        run: |
          repo=zhjnerv/ip-practice-workbench-skills
          if ! can_push=$(gh api "repos/$repo" --jq '.permissions.push'); then
            echo "无法读取 $repo：IP_PRACTICE 缺少该仓库的访问权限或已失效" >&2
            exit 1
          fi
          if [ "$can_push" != "true" ]; then
            echo "IP_PRACTICE 无 $repo 的写权限（permissions.push=$can_push）" >&2
            echo "该 token 需要 Contents: Read and write 与 Pull requests: Read and write" >&2
            exit 1
          fi

      - name: Report token type
        env:
          GH_TOKEN: ${{ secrets.IP_PRACTICE }}
        run: |
          # classic token 会在响应头回 X-OAuth-Scopes，fine-grained token 不回。
          # classic token 按 scope 覆盖账号下所有仓库，做不到只授权一个仓库，因此只提示不中止。
          # 不能用"能否读取某个仓库"判断授权范围：myskill 是 public，任何 token 甚至未认证都能读。
          scopes=$(gh api -i repos/zhjnerv/ip-practice-workbench-skills 2>/dev/null \
            | tr -d '\r' \
            | grep -i '^x-oauth-scopes:' \
            | cut -d: -f2- \
            | tr -d ' ')
          if [ -n "$scopes" ]; then
            echo "::warning::IP_PRACTICE 是 classic token（scopes=$scopes），权限覆盖所有仓库，宽于最小权限"
          else
            echo "IP_PRACTICE 是 fine-grained token（响应头无可枚举 scope）"
          fi

      - name: Create or update source repository PRs
        env:
          GH_TOKEN: ${{ secrets.IP_PRACTICE }}
          SKILLS_INPUT: ${{ inputs.skills }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/sync_ip_practice_skills_to_upstream.py
