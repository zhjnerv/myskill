name: TEMP token probe (delete me)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe IP_PRACTICE access surface
        env:
          GH_TOKEN: ${{ secrets.IP_PRACTICE }}
        run: |
          probe() {
            code=$(gh api -o /dev/null -w '%{http_code}' "$1" 2>/dev/null || echo ERR)
            printf '%-72s %s\n' "$1" "$code"
          }
          echo "--- public repo metadata ---"
          probe repos/zhjnerv/myskill
          probe repos/zhjnerv/ip-practice-workbench-skills
          echo "--- authenticated-only endpoints ---"
          probe repos/zhjnerv/myskill/actions/secrets
          probe repos/zhjnerv/ip-practice-workbench-skills/actions/secrets
          probe repos/zhjnerv/myskill/collaborators/zhjnerv/permission
          probe user
          echo "--- permissions field as seen by this token ---"
          gh api repos/zhjnerv/myskill --jq '.permissions' 2>&1 || true
          gh api repos/zhjnerv/ip-practice-workbench-skills --jq '.permissions' 2>&1 || true
